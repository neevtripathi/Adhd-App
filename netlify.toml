[build]
  command = "npm install --prefix backend && npm install --prefix frontend && npm run build --prefix frontend"
  publish = "frontend/dist"
  functions = "netlify/functions"

# All redirects (API routing + SPA fallback) live in frontend/public/_redirects,
# which Netlify copies into the publish dir. Keeping them in one file avoids
# ordering ambiguity between netlify.toml [[redirects]] and the _redirects file.
