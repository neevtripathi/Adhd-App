[build]
  command = "npm install --prefix backend && npm install --prefix frontend && npm run build --prefix frontend"
  publish = "frontend/dist"
  functions = "netlify/functions"

# API calls stay on the same Netlify site — routed to the bundled Express
# backend running as a serverless function, not a separate host.
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/api/:splat"
  status = 200

# SPA fallback so React Router deep-links don't 404 (mirrors frontend/public/_redirects).
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
